{% extends "base_auth.html" %}
{% block title %}HR administration{% endblock %}
{% block content %}
<h1 class="h2 mb-1">HR Administration</h1>
<p class="text-muted mb-4">Restricted area. Access and exports are recorded in the audit log.</p>
<form method="post" novalidate>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="mb-3"><label class="form-label" for="email">Administrator email</label>
    <input class="form-control" id="email" name="email" type="email" autocomplete="username" required autofocus></div>
  <div class="mb-3"><label class="form-label" for="password">Password</label>
    <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required></div>
  <button class="btn btn-primary w-100" type="submit">Sign in</button>
</form>
<p class="mt-3 mb-0 text-muted small">No administrator yet? Create one on the server with <code>python create_admin.py</code>.</p>
<hr class="my-4">
<a class="btn btn-outline-s w-100" href="{{ url_for('auth.employee_login') }}"><i class="bi bi-person"></i> Employee sign in</a>
{% endblock %}
