{% extends "base_auth.html" %}
{% block title %}Employee sign in{% endblock %}
{% block content %}
<h1 class="h2 mb-1">Welcome back.</h1>
<p class="text-muted mb-4">Sign in to share feedback and view your history.</p>
<form method="post" novalidate>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="mb-3"><label class="form-label" for="email">Work email</label>
    <input class="form-control" id="email" name="email" type="email" autocomplete="username" required autofocus></div>
  <div class="mb-3"><label class="form-label" for="password">Password</label>
    <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required></div>
  <button class="btn btn-primary w-100" type="submit">Sign in</button>
</form>
<div class="d-flex justify-content-between mt-3">
  <a href="{{ url_for('auth.forgot_password') }}">Forgot password?</a>
  <a href="{{ url_for('auth.employee_register') }}">Create account</a>
</div>
<hr class="my-4">
<a class="btn btn-outline-s w-100" href="{{ url_for('auth.admin_login') }}"><i class="bi bi-shield-lock"></i> HR administrator sign in</a>
{% endblock %}
