{% extends "base_auth.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<h1 class="h2 mb-1">Create your account</h1>
<p class="text-muted mb-4">Use your work email. Your feedback can be submitted anonymously to HR.</p>
<form method="post" novalidate>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="mb-3"><label class="form-label" for="full_name">Full name</label>
    <input class="form-control" id="full_name" name="full_name" maxlength="120" value="{{ form.get('full_name','') }}" required></div>
  <div class="mb-3"><label class="form-label" for="email">Work email</label>
    <input class="form-control" id="email" name="email" type="email" maxlength="180" value="{{ form.get('email','') }}" required></div>
  <div class="row g-3 mb-3">
    <div class="col-sm-6"><label class="form-label" for="department_id">Department</label>
      <select class="form-select" id="department_id" name="department_id" required>
        <option value="">Select…</option>
        {% for d in departments %}<option value="{{ d.id }}" {{ 'selected' if form.get('department_id') == d.id|string }}>{{ d.name }}</option>{% endfor %}
      </select></div>
    <div class="col-sm-6"><label class="form-label" for="years_experience">Years of experience</label>
      <input class="form-control" id="years_experience" name="years_experience" type="number" min="0" max="60" step="0.5" value="{{ form.get('years_experience','') }}" required></div>
  </div>
  <div class="mb-3"><label class="form-label" for="role_title">Job title</label>
    <input class="form-control" id="role_title" name="role_title" maxlength="120" value="{{ form.get('role_title','') }}" required></div>
  <div class="mb-3"><label class="form-label" for="password">Password</label>
    <input class="form-control" id="password" name="password" type="password" autocomplete="new-password" required>
    <div class="form-text">At least 10 characters, including a letter and a digit.</div></div>
  <div class="mb-3"><label class="form-label" for="confirm_password">Confirm password</label>
    <input class="form-control" id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required></div>
  <button class="btn btn-primary w-100" type="submit">Create account</button>
</form>
<p class="mt-3 mb-0 text-center">Already registered? <a href="{{ url_for('auth.employee_login') }}">Sign in</a></p>
{% endblock %}
